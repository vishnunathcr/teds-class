<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Mia’s scale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf3e0; --green:#84a282; --mint:#b8cfb3; --ring:#d9d9d9; --field:#f7f7f7; --text:#000; --red:#d6453d;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--text);font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-y:auto}
.hidden{display:none!important}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:3px}
p{margin:0}

/* shared */
.screen{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px}
.cta{width:240px;height:60px;background:var(--green);color:#fff;border:0;border-radius:8px;font-size:24px;font-weight:700}
.cta:active{transform:translateY(1px)}
.fallback svg{width:100%;height:100%;display:block}

/* start screen */
.start{position:relative;width:760px;height:720px;max-width:100%}
.start-art{position:absolute;left:0;top:100px;width:453px;height:607px;background:center/contain no-repeat}
.bubble{position:absolute;left:237px;top:0;width:498px;height:199px}
.bubble svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.bubble p{position:absolute;left:15.9%;top:14%;width:68.3%;height:63.8%;display:flex;align-items:center;justify-content:center;text-align:center;font-size:24px;line-height:1.25;padding:10px}
.start-info{position:absolute;left:414px;top:255px;width:340px;display:flex;flex-direction:column;align-items:center;gap:56px}
.start-info .top{display:flex;flex-direction:column;align-items:center;gap:25px}
.start-info .desc{font-size:20px;padding:10px}
.hs{font-size:20px;padding:10px;text-align:center}

/* play screen */
#play{display:flex;flex-direction:column;min-height:100%}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 32px;font-size:24px;gap:8px}
.topbar>*{flex:1 1 0;min-width:0}
.topbar .mid{text-align:center}.topbar .r{text-align:right}
.exit{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;color:var(--green);font-size:inherit;font-weight:700}
.exit svg{width:24px;height:24px;flex:none}
.playbody{display:flex;justify-content:center;align-items:flex-start;padding:48px 16px 24px}
.char{--h:min(627px,72vh);height:var(--h);aspect-ratio:550.4/768;flex:none;background-repeat:no-repeat;background-size:500% 200%}
.right{width:280px;display:flex;flex-direction:column;align-items:center;gap:80px;flex:none}
.block{display:flex;flex-direction:column;align-items:center;gap:48px;width:100%}
.ring{position:relative;width:280px;height:280px;display:flex;align-items:center;justify-content:center;font-size:48px;color:var(--mint)}
.ring svg{position:absolute;inset:0;width:100%;height:100%}
.ring circle{stroke:var(--ring)}
.ring.low circle{stroke:var(--red)}
.eq{font-size:64px;font-weight:700;color:var(--mint);display:flex;gap:16px;white-space:nowrap}
.answer{display:flex;flex-direction:column;align-items:center;gap:16px;width:200px}
.answer label{font-size:24px}
#answer{width:200px;height:80px;background:var(--field);color:var(--text);border:1px solid var(--mint);border-radius:8px;font:inherit;font-size:40px;text-align:center;padding:0 12px}
#answer.bad{animation:shake .3s;border-color:var(--red)}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.char.swap{animation:swap .25s ease-out}
@keyframes swap{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}

/* game over screen */
.over-art{position:relative;width:min(941px,100%);aspect-ratio:941/438;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.over-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.over-art .big{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(56px,16vw,230px);letter-spacing:-.03em;white-space:nowrap}
.over-art .who{position:relative;height:96%;aspect-ratio:200/220}
.over-info{width:min(340px,100%);margin:24px auto 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:56px;text-align:center}
.over-info .hs{width:100%;text-align:center;margin:0 auto}
.over-info .top>div{width:100%;text-align:center}
.over-info .top{display:flex;flex-direction:column;align-items:center;gap:25px}
.over-info .msg{font-size:20px;padding:10px;text-align:center;width:320px;max-width:100%}
.over-info .sc{font-size:20px;font-weight:700;padding:10px}

@media (max-width:760px){
  .start{width:100%;height:auto;display:flex;flex-direction:column;align-items:center;gap:20px}
  .start>*{position:static!important}
  .bubble{position:relative!important;width:min(498px,100%);height:auto;aspect-ratio:498/199;order:1;margin-bottom:8px}
  .bubble p{font-size:clamp(14px,4.2vw,20px);padding:4px}
  .start-art{width:min(300px,70%);height:34vh;order:2}
  .start-info{order:3;width:100%;gap:24px}
  .topbar{padding:10px 16px;font-size:16px}
  .playbody{flex-direction:column;align-items:center;padding-top:8px;gap:12px}
  .char{--h:28vh}
  .right{gap:20px}.block{gap:12px}
  .ring{width:min(200px,22vh);height:min(200px,22vh);font-size:36px}
  .eq{font-size:48px}
  .answer{gap:8px}.answer label{font-size:20px}
  #answer{height:64px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<body>

<section id="start" class="screen">
  <div class="start">
    <div class="start-art" id="startArt"></div>
    <div class="bubble"><svg viewBox="0 0 498 199" aria-hidden="true"><path transform="translate(10 10)" fill="#fff" stroke="#000" stroke-width="4" stroke-linejoin="round" d="M239 0C371.153 0 478 30.292 478 70.912 478 108.777 322 139.558 202.5 143 163.135 160.212 175.5 156 134.965 179L168.706 137.004C70.294 127.365 0 103.269 0 70.912 0 30.292 106.847 0 239 0Z"/></svg><p>Hi, I'm Professor Mia! Beat the clock on every problem.</p></div>
    <div class="start-info">
      <div class="top">
        <p class="desc">Add the two numbers and type the answer. Each correct sum scores 1 point and restarts the 10-second timer.</p>
        <button class="cta" id="startBtn">START</button>
      </div>
      <p class="hs">Highest score: <span class="bestTxt">00</span></p>
    </div>
  </div>
</section>

<section id="play" class="hidden">
  <header class="topbar">
    <button class="exit" id="exitBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>Exit</button>
    <span class="mid">Your score: <span id="score">00</span></span>
    <span class="r">Best score: <span class="bestTxt">00</span></span>
  </header>
  <div class="playbody">
    <div class="char" id="char" role="img" aria-label="Professor Mia"></div>
    <div class="right">
      <div class="block">
        <div class="ring" id="ring">
          <svg viewBox="0 0 280 280" aria-hidden="true"><circle id="arc" cx="140" cy="140" r="131" fill="none" stroke-width="18" transform="rotate(-90 140 140)"/></svg>
          <span id="time">10</span>
        </div>
        <div class="eq" id="eq" aria-live="polite"></div>
      </div>
      <div class="answer">
        <label for="answer">Answer</label>
        <input id="answer" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
      </div>
    </div>
  </div>
</section>

<section id="over" class="screen hidden">
  <div class="over-art" id="overArt"></div>
  <div class="over-info">
    <div class="top">
      <div><p class="msg">The clock beat you this time. Try again!</p><p class="sc">Your score: <span id="final">00</span></p></div>
      <button class="cta" id="againBtn">TRY AGAIN</button>
    </div>
    <p class="hs">Highest score: <span class="bestTxt">00</span></p>
  </div>
</section>

<script>
(function(){
  var PER=10, C=2*Math.PI*131;
  /* Image files (export from Figma into an img folder next to this page):
     sprite.png = "character sprite" (5 columns x 2 rows = 10 poses), start.png, gameover.png */
  var SRC={sprite:"img/sprite.webp", start:"img/start.webp", over:"img/gameover.webp"};
  var COLS=5, ROWS=2;
  var have={sprite:false,start:false,over:false};
  var $=function(id){return document.getElementById(id);};
  var start=$("start"), play=$("play"), over=$("over");
  var charEl=$("char"), eq=$("eq"), input=$("answer"), arc=$("arc"), ring=$("ring"), timeEl=$("time");
  var score=0, best=0, beat=false, target=0, deadline=0, raf=0, running=false, pose=-1;
  arc.setAttribute("stroke-dasharray", C+" "+C);
  function pad(n){return n<10?"0"+n:""+n;}
  try{best=parseInt(localStorage.getItem("sumsprint-best")||"0",10)||0;}catch(e){}

  /* Fallback cartoon (used only when the Figma images are not present) */
  function prof(m){
    var K="#1b2a6b", e, b, mo, x;
    if(m===1){
      e='<path d="M72 93q12-13 24 0M104 93q12-13 24 0" fill="none" stroke="'+K+'" stroke-width="3.5" stroke-linecap="round"/>';
      b='<path d="M74 72q10-6 20 0M106 72q10-6 20 0" fill="none" stroke="#4a2c2a" stroke-width="3" stroke-linecap="round"/>';
      mo='<path d="M86 112q14 20 28 0z" fill="#7a2230" stroke="'+K+'" stroke-width="2.5" stroke-linejoin="round"/>';
      x='<path d="M150 60l4 9 9 4-9 4-4 9-4-9-9-4 9-4z" fill="#f2b705"/>';
    } else if(m===2){
      e='<path d="M72 92q12 11 24 0M104 92q12 11 24 0" fill="none" stroke="'+K+'" stroke-width="3.5" stroke-linecap="round"/>';
      b='<path d="M72 74l22 5M128 74l-22 5" fill="none" stroke="#4a2c2a" stroke-width="3" stroke-linecap="round"/>';
      mo='<path d="M89 122q11-10 22 0" fill="none" stroke="#a63a30" stroke-width="3" stroke-linecap="round"/>';
      x='<path d="M82 106q-6 10 0 12t0-12z" fill="#5bb8f0" stroke="'+K+'" stroke-width="2"/>';
    } else {
      e='<circle cx="84" cy="93" r="3.5" fill="'+K+'"/><circle cx="116" cy="93" r="3.5" fill="'+K+'"/>';
      b='<path d="M74 75q10-5 20 0M106 75q10-5 20 0" fill="none" stroke="#4a2c2a" stroke-width="3" stroke-linecap="round"/>';
      mo='<path d="M90 113q10 8 20 0" fill="none" stroke="#a63a30" stroke-width="3" stroke-linecap="round"/>';
      x='<path d="M150 150l30-34" stroke="#8a5a2b" stroke-width="5" stroke-linecap="round"/><circle cx="182" cy="113" r="4" fill="#fff" stroke="'+K+'" stroke-width="2"/>';
    }
    return '<svg viewBox="0 0 200 220" aria-hidden="true"><g stroke="'+K+'" stroke-width="2.5" stroke-linejoin="round">'
    +'<circle cx="100" cy="30" r="16" fill="#4a2c2a"/>'
    +'<path d="M54 96Q50 40 100 40Q150 40 146 96L148 152Q140 162 128 152L72 152Q60 162 52 152Z" fill="#4a2c2a"/>'
    +'<rect x="90" y="130" width="20" height="26" fill="#f5c6a0"/>'
    +'<path d="M30 220Q34 162 72 152L128 152Q166 162 170 220Z" fill="#2f7d8c"/>'
    +'<path d="M84 152L100 184L116 152Z" fill="#fff"/>'
    +'<ellipse cx="100" cy="92" rx="42" ry="46" fill="#f5c6a0"/>'
    +'<path d="M58 92Q60 46 100 46Q140 46 142 92Q120 64 100 68Q80 64 58 92Z" fill="#4a2c2a"/></g>'
    +'<ellipse cx="72" cy="108" rx="8" ry="5" fill="#f08a7e" opacity=".55"/><ellipse cx="128" cy="108" rx="8" ry="5" fill="#f08a7e" opacity=".55"/>'
    +b+e+mo
    +'<g fill="#fff" fill-opacity=".25" stroke="#3a2a55" stroke-width="3"><circle cx="84" cy="93" r="15"/><circle cx="116" cy="93" r="15"/></g>'
    +x+'</svg>';
  }

  /* Artwork */
  function renderStart(){
    var a=$("startArt");
    if(have.start){a.className="start-art";a.innerHTML="";a.style.backgroundImage='url("'+SRC.start+'")';}
    else{a.className="start-art fallback";a.style.backgroundImage="none";a.innerHTML=prof(0);}
  }
  function renderOver(){
    var a=$("overArt");
    if(have.over) a.innerHTML='<img alt="Time\u2019s up" src="'+SRC.over+'">';
    else a.innerHTML='<div class="big">TIME\u2019S UP</div><div class="who">'+prof(score>=5?1:2)+'</div>';
  }
  function poseCount(){return have.sprite?COLS*ROWS:3;}
  function setPose(i){
    pose=i;
    if(have.sprite){
      charEl.className="char";
      charEl.innerHTML="";
      charEl.style.backgroundImage='url("'+SRC.sprite+'")';
      charEl.style.backgroundPosition=((i%COLS)*100/(COLS-1))+"% "+(Math.floor(i/COLS)*100/(ROWS-1))+"%";
    } else {
      charEl.className="char fallback";
      charEl.style.backgroundImage="none";
      charEl.innerHTML=prof(i);
    }
    charEl.classList.remove("swap");void charEl.offsetWidth;charEl.classList.add("swap");
  }
  function randomPose(){
    var n=poseCount(), i;
    if(n<2) return 0;
    do{i=Math.floor(Math.random()*n);}while(i===pose);
    return i;
  }
  function probe(key){
    var im=new Image();
    im.onload=function(){have[key]=true;renderStart();if(key==="sprite"&&running)setPose(randomPose());};
    im.onerror=function(){have[key]=false;};
    im.src=SRC[key];
  }

  function show(el){[start,play,over].forEach(function(s){s.classList.add("hidden");});el.classList.remove("hidden");}
  function rnd(){return Math.floor(Math.random()*90)+10;}
  function setScore(){
    $("score").textContent=pad(score);
    Array.prototype.forEach.call(document.querySelectorAll(".bestTxt"),function(n){n.textContent=pad(best);});
  }

  function newQuestion(){
    var a=rnd(), b=rnd();
    target=a+b;
    eq.innerHTML='<span>'+a+'</span><span>+</span><span>'+b+'</span>';
    input.value="";
    deadline=performance.now()+PER*1000;
    ring.classList.remove("low");
  }
  function frame(now){
    if(!running) return;
    var rem=Math.max(0,deadline-now), el=1-rem/(PER*1000);
    arc.setAttribute("stroke-dashoffset", String(-el*C));
    arc.setAttribute("stroke-dasharray", ((1-el)*C)+" "+C);
    var s=Math.ceil(rem/1000);
    timeEl.textContent=s;
    ring.classList.toggle("low", s<=3);
    if(rem<=0){end();return;}
    raf=requestAnimationFrame(frame);
  }
  function begin(){
    score=0; beat=false; running=true; pose=-1; setScore();
    show(play); setPose(randomPose()); newQuestion(); input.focus();
    cancelAnimationFrame(raf); raf=requestAnimationFrame(frame);
  }
  function stop(){running=false;cancelAnimationFrame(raf);}
  function end(){
    stop();
    $("final").textContent=pad(score);
    renderOver(); setScore();
    show(over); $("againBtn").focus();
  }
  function submit(){
    if(!running) return;
    var v=input.value.trim();
    if(v==="") return;
    if(parseInt(v,10)===target){
      score++;
      if(score>best){best=score;beat=true;try{localStorage.setItem("sumsprint-best",String(best));}catch(e){}}
      setScore();
      setPose(randomPose());   /* new random pose on every correct answer */
      newQuestion();
    } else {
      input.classList.remove("bad");void input.offsetWidth;input.classList.add("bad");
      input.select();
    }
  }

  input.addEventListener("input",function(){input.value=input.value.replace(/[^0-9]/g,"");});
  input.addEventListener("keydown",function(e){if(e.key==="Enter")submit();});
  $("startBtn").addEventListener("click",begin);
  $("againBtn").addEventListener("click",begin);
  $("exitBtn").addEventListener("click",function(){stop();setScore();show(start);});

  setScore(); renderStart();
  probe("sprite"); probe("start"); probe("over");
})();
</script>
</body>
</html>
